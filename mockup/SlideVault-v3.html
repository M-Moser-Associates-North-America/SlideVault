<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideVault v3 prototype</title>
<style>
/* ------------------------------------------------------------------
   Shell-owned document styles. In the real app the application shell
   owns html/body; the workspace below never resets global elements.
------------------------------------------------------------------- */
html, body { margin: 0; }
body { background: #f3f4f6; }
body.sv-body-dark { background: #0b0c0f; }

/* ------------------------------------------------------------------
   Tokens: copied from docs/design-tokens.css (2026-09-29).
------------------------------------------------------------------- */
.slidevault {
  color-scheme: light;
  --sv-brand: #ff3f0a; --sv-brand-strong: #d93407; --sv-brand-tint: #ffe6dc;
  --sv-bg: #f3f4f6; --sv-surface: #ffffff; --sv-surface-sunken: #eceef1; --sv-surface-muted: #e4e7eb;
  --sv-text: #1a1a1a; --sv-text-secondary: #6b6b6b;
  --sv-border: rgba(20,20,20,0.12); --sv-border-strong: rgba(20,20,20,0.20);
  --sv-action-bg: #1a1a1a; --sv-action-fg: #ffffff;
  --sv-success: #1f9d63; --sv-warning: #c9930c; --sv-danger: #d14b3c;
  --sv-frame: #eceef1; --sv-placeholder: #6b6b6b; --sv-link: #b92d09; --sv-focus: #d93407; --sv-control-border: #777777;
  --sv-font-sans: "Helvetica Neue", "Helvetica", "Arimo", Arial, system-ui, -apple-system, sans-serif;
  --sv-text-body: 14.5px; --sv-text-small: 13px; --sv-text-meta: 12.5px;
  --sv-text-heading: 32px; --sv-text-section: 23px; --sv-text-subheading: 18px;
  --sv-leading-body: 1.55; --sv-leading-heading: 1.3;
  --sv-radius-control: 11px; --sv-radius-card: 16px; --sv-radius-composer: 18px; --sv-radius-panel: 24px; --sv-radius-pill: 999px;
  --sv-shadow-card: 0 1px 2px rgba(20,20,28,0.06), 0 10px 28px -22px rgba(20,20,28,0.30);
  --sv-shadow-panel: 0 30px 70px -30px rgba(20,20,28,0.26), 0 6px 18px -12px rgba(20,20,28,0.08);
  --sv-shadow-popover: 0 12px 30px -10px rgba(20,20,28,0.18);
  --sv-ease-out: cubic-bezier(0,0,0.2,1);
  --sv-duration-fast: 150ms; --sv-duration: 220ms; --sv-duration-slow: 320ms;
  /* Prototype extensions (not in the token file): readable status text. */
  --svp-danger-text: #b3261e; --svp-warning-tint: #fff4d6; --svp-danger-tint: #fde8e6; --svp-success-tint: #e3f5ec;
}
.slidevault[data-theme="dark"] {
  color-scheme: dark;
  --sv-brand: #ff5a2c; --sv-brand-strong: #ff7048; --sv-brand-tint: rgba(255,63,10,0.16);
  --sv-bg: #0b0c0f; --sv-surface: #191a1e; --sv-surface-sunken: rgba(255,255,255,0.08); --sv-surface-muted: rgba(255,255,255,0.12);
  --sv-text: #f4f4f4; --sv-text-secondary: #a9a9ac;
  --sv-border: rgba(255,255,255,0.14); --sv-border-strong: rgba(255,255,255,0.23);
  --sv-action-bg: #fafafa; --sv-action-fg: #0b0b0d;
  --sv-success: #34c77d; --sv-warning: #e0a33c; --sv-danger: #f0685a;
  --sv-frame: #26272c; --sv-placeholder: #a9a9ac; --sv-link: #ff8a67; --sv-focus: #ff7048; --sv-control-border: #83848a;
  --sv-shadow-card: 0 1px 0 rgba(255,255,255,0.04), 0 12px 30px -20px rgba(0,0,0,0.90);
  --sv-shadow-panel: 0 30px 70px -30px rgba(0,0,0,0.65), 0 6px 18px -12px rgba(0,0,0,0.40);
  --sv-shadow-popover: 0 12px 30px -10px rgba(0,0,0,0.60);
  --svp-danger-text: #ff9a8f; --svp-warning-tint: rgba(224,163,60,0.16); --svp-danger-tint: rgba(240,104,90,0.16); --svp-success-tint: rgba(52,199,125,0.14);
}
@media (prefers-reduced-motion: reduce) {
  .slidevault { --sv-duration-fast: 0ms; --sv-duration: 0ms; --sv-duration-slow: 0ms; }
}

/* ------------------------------------------------------------------
   Base (scoped to .slidevault)
------------------------------------------------------------------- */
.slidevault { font-family: var(--sv-font-sans); font-size: var(--sv-text-body); line-height: var(--sv-leading-body); color: var(--sv-text); }
.slidevault *, .slidevault *::before, .slidevault *::after { box-sizing: border-box; }
.slidevault :where(h1, h2, h3, p, dl, dd, figure) { margin: 0; }
.slidevault :where(h1, h2, h3) { line-height: var(--sv-leading-heading); font-weight: 600; }
.slidevault :where(button, input, select, textarea) { font: inherit; color: inherit; }
.slidevault :where(a) { color: var(--sv-link); }
.slidevault :focus-visible { outline: 2px solid var(--sv-focus); outline-offset: 2px; }
.slidevault [tabindex="-1"]:focus { outline: none; }
.slidevault .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.slidevault .ic { width: 18px; height: 18px; flex: none; }
.slidevault .ic-sm { width: 14px; height: 14px; }
.sv-app { background: var(--sv-bg); min-height: 100vh; display: flex; flex-direction: column; }
.sv-wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 40px; }
@media (max-width: 900px) { .sv-wrap { padding: 0 20px; } }
@media (max-width: 480px) { .sv-wrap { padding: 0 16px; } }
.sv-main { flex: 1; padding: 24px 0 120px; outline: none; }
.meta { font-size: var(--sv-text-meta); color: var(--sv-text-secondary); }
.muted { color: var(--sv-text-secondary); }
.stack > * + * { margin-top: 12px; }
.row-flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.h1 { font-size: 30px; }
.h2 { font-size: var(--sv-text-subheading); }
@media (max-width: 480px) { .h1 { font-size: 24px; } }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--sv-text-secondary); }

/* Skip link */
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--sv-action-bg); color: var(--sv-action-fg); border: 0; border-radius: var(--sv-radius-control); padding: 10px 14px; font-weight: 600; cursor: pointer; }
.skip:focus { top: 12px; }

/* ------------------------------------------------------------------
   Buttons, fields, chips
------------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--sv-radius-control); border: 1px solid var(--sv-control-border); background: var(--sv-surface); color: var(--sv-text); font-size: var(--sv-text-small); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color var(--sv-duration-fast) var(--sv-ease-out); }
.btn:hover { background: var(--sv-surface-sunken); }
.btn-primary { background: var(--sv-action-bg); color: var(--sv-action-fg); border-color: var(--sv-action-bg); }
.btn-primary:hover { background: var(--sv-action-bg); opacity: .86; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--sv-surface-sunken); }
.btn-danger { color: var(--svp-danger-text); border-color: var(--sv-danger); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 36px; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { border-color: var(--sv-brand); box-shadow: inset 0 0 0 1px var(--sv-brand); }
.btn-link { background: none; border: 0; padding: 4px 2px; color: var(--sv-link); font-weight: 600; font-size: var(--sv-text-small); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label, .legend { font-size: var(--sv-text-small); font-weight: 600; }
.hint { font-size: var(--sv-text-meta); color: var(--sv-text-secondary); }
.err { font-size: var(--sv-text-meta); color: var(--svp-danger-text); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.input, .select { min-height: 40px; border: 1px solid var(--sv-control-border); border-radius: var(--sv-radius-control); background: var(--sv-surface); padding: 0 12px; width: 100%; min-width: 0; }
.input::placeholder { color: var(--sv-placeholder); opacity: 1; }
.input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--sv-danger); box-shadow: inset 0 0 0 1px var(--sv-danger); }
.select-sm { min-height: 36px; font-size: var(--sv-text-small); width: auto; }
.badge { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 9px; border-radius: var(--sv-radius-pill); font-size: 12px; font-weight: 600; background: var(--sv-surface-sunken); color: var(--sv-text); border: 1px solid var(--sv-border); white-space: nowrap; line-height: 1.2; }
.badge .ic { width: 13px; height: 13px; }
.badge.cls-canonical { background: var(--sv-brand-tint); border-color: transparent; }
.badge.warn { background: var(--svp-warning-tint); border-color: transparent; }
.badge.danger { background: var(--svp-danger-tint); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot-approved { background: var(--sv-success); }
.dot-draft { background: var(--sv-warning); }
.dot-retired { background: transparent; border: 1.5px solid var(--sv-text-secondary); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--sv-radius-pill); border: 1px solid var(--sv-border-strong); background: var(--sv-surface); color: var(--sv-text); font-size: var(--sv-text-small); cursor: pointer; text-decoration: none; }
.chip-btn:hover { background: var(--sv-surface-sunken); }
.chip-btn[aria-pressed="true"], .chip-btn[aria-selected="true"] { background: var(--sv-action-bg); color: var(--sv-action-fg); border-color: var(--sv-action-bg); }

/* Tooltips for disabled controls */
.tipw { position: relative; display: inline-flex; }
.tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--sv-action-bg); color: var(--sv-action-fg); font-size: 12.5px; font-weight: 500; line-height: 1.4; padding: 6px 10px; border-radius: 8px; width: max-content; max-width: 240px; white-space: normal; z-index: 40; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity var(--sv-duration-fast); text-align: left; }
.tipw:hover .tip, .tipw:focus-within .tip { opacity: 1; visibility: visible; }
.tip.tip-end { left: auto; right: 0; transform: none; }
.tip.tip-start { left: 0; transform: none; }
.tip.tip-below { bottom: auto; top: calc(100% + 8px); }

/* Banners and states */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--sv-border); background: var(--sv-surface); font-size: var(--sv-text-small); }
.banner .ic { margin-top: 1px; }
.banner.sim { background: var(--svp-warning-tint); border-color: transparent; }
.banner.danger { background: var(--svp-danger-tint); border-color: transparent; }
.banner.ok { background: var(--svp-success-tint); border-color: transparent; }
.banner.info { background: var(--sv-surface-sunken); border-color: transparent; }
.sim-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 6px; background: var(--svp-warning-tint); color: var(--sv-text); white-space: nowrap; }
.state { text-align: center; padding: 48px 20px; border: 1px dashed var(--sv-border-strong); border-radius: var(--sv-radius-card); background: var(--sv-surface); }
.state .ic-big { width: 36px; height: 36px; color: var(--sv-text-secondary); }
.state h2 { font-size: 18px; margin: 10px 0 6px; }
.state p { color: var(--sv-text-secondary); max-width: 520px; margin: 0 auto 16px; }
.state.error { border-style: solid; border-color: var(--sv-danger); }
.skel { background: var(--sv-surface-sunken); border-radius: 8px; position: relative; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: sv-shimmer 1.1s var(--sv-ease-out) 3; }
  .spin { animation: sv-spin 1s linear infinite; }
}
@keyframes sv-shimmer { to { transform: translateX(100%); } }
@keyframes sv-spin { to { transform: rotate(360deg); } }
/* Breadcrumbs */
.crumbs { margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 0; padding: 0; font-size: var(--sv-text-small); min-width: 0; }
.crumbs li { display: inline-flex; align-items: center; gap: 2px; min-width: 0; }
.crumbs li + li::before { content: "›"; color: var(--sv-text-secondary); padding: 0 6px; }
.crumbs a { color: var(--sv-text); text-decoration: underline; text-decoration-color: var(--sv-border-strong); text-underline-offset: 3px; }
.crumbs a:hover { text-decoration-color: currentColor; }
.crumbs [aria-current] { font-weight: 600; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-link { font-size: var(--sv-text-small); }

/* ------------------------------------------------------------------
   Cards, thumbnails
------------------------------------------------------------------- */
.card { background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: var(--sv-radius-card); box-shadow: var(--sv-shadow-card); overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
.card.is-selected { border-color: var(--sv-brand); box-shadow: 0 0 0 1px var(--sv-brand), var(--sv-shadow-card); }
.thumb { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--sv-surface-sunken); border: 0; padding: 0; margin: 0; cursor: zoom-in; position: relative; overflow: hidden; }
.thumb svg { width: 100%; height: 100%; display: block; }
.thumb .zoom { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 8px; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity var(--sv-duration-fast); }
.thumb:hover .zoom, .thumb:focus-visible .zoom { opacity: 1; }
.thumb:focus-visible { outline-offset: -3px; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.card-title { font-weight: 600; font-size: 14.5px; color: var(--sv-text); text-decoration: none; line-height: 1.35; overflow-wrap: anywhere; }
.slidevault a.card-title { color: var(--sv-text); }
.card-title:hover { text-decoration: underline; }
.matched { font-size: var(--sv-text-meta); color: var(--sv-text); background: var(--sv-surface-sunken); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; }
.matched b { display: flex; align-items: center; gap: 5px; font-weight: 600; margin-bottom: 2px; }
.card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.cmp-check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--sv-text-small); font-weight: 600; cursor: pointer; min-height: 36px; padding: 0 10px 0 8px; border-radius: var(--sv-radius-control); border: 1px solid var(--sv-control-border); background: var(--sv-surface); }
.cmp-check input { width: 18px; height: 18px; accent-color: var(--sv-brand-strong); margin: 0; }
.cmp-check:has(input:checked) { border-color: var(--sv-brand); box-shadow: inset 0 0 0 1px var(--sv-brand); }
.card-top { position: absolute; top: 8px; left: 8px; z-index: 2; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.slidevault a:has(> .mosaic) { text-decoration: none; display: block; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; aspect-ratio: 16/9; background: var(--sv-surface-sunken); padding: 3px; }
.mosaic > * { min-height: 0; overflow: hidden; border-radius: 3px; }
.mosaic svg { width: 100%; height: 100%; display: block; }
.mosaic .ph { border: 1.5px dashed var(--sv-control-border); display: grid; place-items: center; font-size: 10px; color: var(--sv-text-secondary); text-align: center; }

.row { margin-top: 32px; }
.row-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.row-head h2 { font-size: 18px; }
.row-head .sub { font-size: var(--sv-text-meta); color: var(--sv-text-secondary); }
.row-scroller { display: grid; grid-auto-flow: column; grid-auto-columns: 250px; gap: 16px; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 14px; margin: 0 -2px; list-style: none; scrollbar-width: thin; }
.row-scroller > li { scroll-snap-align: start; display: flex; min-width: 0; }
.row-scroller > li > .card { width: 100%; }
@media (max-width: 480px) { .row-scroller { grid-auto-columns: 78%; } }
@media (prefers-reduced-motion: no-preference) { .row-scroller { scroll-behavior: smooth; } }
.row-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
/* Detail screens */
.detail { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 28px; align-items: start; }
.slide-detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .detail, .slide-detail { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: var(--sv-radius-card); padding: 20px; box-shadow: var(--sv-shadow-card); min-width: 0; }
.panel h2 { font-size: 15px; margin-bottom: 10px; }
.trust { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: var(--sv-text-small); }
.trust dt { color: var(--sv-text-secondary); }
.trust dd { font-weight: 500; overflow-wrap: anywhere; }
.unknown { font-style: italic; color: var(--sv-text-secondary); font-weight: 400; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--sv-surface-sunken); }
.big-preview { border-radius: var(--sv-radius-card); overflow: hidden; border: 1px solid var(--sv-border); }
.divider { border: 0; border-top: 1px solid var(--sv-border); margin: 16px 0; }
.slide-text { font-size: var(--sv-text-small); background: var(--sv-surface-sunken); border-radius: 10px; padding: 12px 14px; }

/* Toasts */
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toasts.lift { bottom: 100px; }
.toast { background: var(--sv-action-bg); color: var(--sv-action-fg); border-radius: 12px; padding: 10px 10px 10px 14px; box-shadow: var(--sv-shadow-popover); display: flex; gap: 10px; align-items: center; font-size: var(--sv-text-small); }
.toast .msg { flex: 1; }
.toast button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; min-height: 32px; padding: 0 10px; font-weight: 600; cursor: pointer; font-size: 12.5px; }
.toast .x { border: 0; width: 32px; padding: 0; display: grid; place-items: center; }

/* Dialogs */
dialog.sv-dialog { border: 1px solid var(--sv-border); padding: 0; border-radius: var(--sv-radius-panel); background: var(--sv-surface); color: var(--sv-text); box-shadow: var(--sv-shadow-panel); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog.sv-dialog[open] { display: flex; flex-direction: column; }
dialog.sv-dialog::backdrop { background: rgba(10,10,14,.6); }
dialog.sv-dialog.wide { width: min(1120px, calc(100vw - 24px)); }
.dlg-head { padding: 18px 20px 10px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg-head h2 { font-size: 18px; }
.dlg-body { padding: 4px 24px 16px; overflow: auto; min-height: 0; }
.dlg-foot { padding: 12px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--sv-border); }
.lb-stage { position: relative; background: var(--sv-surface-sunken); border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; max-height: 66vh; margin: 0 auto; }
.lb-stage svg { width: 100%; height: 100%; display: block; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; border-radius: 50%; width: 44px; height: 44px; padding: 0; background: var(--sv-surface); box-shadow: var(--sv-shadow-popover); }
.lb-prev { left: 10px; } .lb-next { right: 10px; }
.lb-caption { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 12px; }
.counter { font-variant-numeric: tabular-nums; font-size: var(--sv-text-small); font-weight: 600; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; }
.steps li.now { background: var(--sv-surface-sunken); font-weight: 700; }
.steps li .st { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--sv-control-border); flex: none; }
.steps li.done .st { background: var(--sv-success); border-color: var(--sv-success); color: #fff; }
.steps li.fail .st { background: var(--sv-danger); border-color: var(--sv-danger); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--sv-surface-sunken); border-radius: 12px; padding: 12px 14px; }
.stat b { display: block; font-size: 20px; }
.prov { width: 100%; border-collapse: collapse; font-size: var(--sv-text-small); }
.prov th, .prov td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--sv-border); vertical-align: top; }
.prov th { font-size: 12px; color: var(--sv-text-secondary); font-weight: 600; }
.table-wrap { overflow-x: auto; }

/* contrast */

.mini-n { background: var(--sv-brand-strong); }

.try { margin-top: 10px; }

    var key = searchHref(qs); S.searchDone[key] = true; location.hash = key;
  }
}
root.addEventListener('click', onClick);
root.addEventListener('change', onChange);
dlg.addEventListener('click', onClick);
var tq0 = $('#top-q'), tclr = $('#top-clear');
function syncClear() { tclr.hidden = !tq0.value; }
tq0.addEventListener('input', syncClear);
tclr.addEventListener('click', function () { tq0.value = ''; syncClear(); tq0.focus(); });
$('#top-search').addEventListener('submit', function (e) {
  e.preventDefault();
  var q = $('#top-q').value.trim(); if (!q) return;
  location.hash = searchHref({ q: q }); $('#top-q').blur();
});
document.addEventListener('keydown', function (e) {
  var tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT');
  if (e.key === '/' && !typing && !dlg.open) { e.preventDefault(); $('#top-q').focus(); }
  else if (e.key === 'Escape' && tg === $('#top-q')) { tg.blur(); }
});
$('#role').addEventListener('change', function (e) {
  S.role = e.target.value; persist();
  S.sel = S.sel.filter(function (id) { return SLIDE_MAP[id] && canSee(slide(id).status); });
  var r = route();
  if (r.name === 'upload' && !can('upload')) location.hash = '#/'; else render();
  $('#role').focus();
  toast('Access: ' + S.role.charAt(0).toUpperCase() + S.role.slice(1) + '. ' + ({ viewer: 'You see Approved slides.', editor: 'You see Approved and Suggested slides, and can upload.', curator: 'You see everything and can approve or retire.' })[S.role]);
});
$('#role-info').addEventListener('click', openRoleInfo);
$('#theme-btn').addEventListener('click', function () { S.theme = S.theme === 'dark' ? 'light' : 'dark'; persist(); applyTheme(); render(); $('#theme-btn').focus(); });
$('#skip').addEventListener('click', function () { var h = main.querySelector('h1') || main; h.setAttribute('tabindex', '-1'); h.focus(); });

/* Init */
$$('[data-icon]').forEach(function (el) { el.outerHTML = ic(el.getAttribute('data-icon')); });
load();
applyTheme();
window.addEventListener('hashchange', function () { trackHistory(); render(); });
trackHistory();
render();
})();
</script>
