<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlideVault v2 prototype</title>
<style>
/* ------------------------------------------------------------------
   Shell-owned document styles. In the real app the application shell
   owns html/body; the workspace below never resets global elements.
------------------------------------------------------------------- */
html, body { margin: 0; }
body { background: #ffffff; }
body.sv-body-dark { background: #0b0c0f; }

/* ------------------------------------------------------------------
   Tokens: copied from docs/design-tokens.css (2026-09-29).
------------------------------------------------------------------- */
.slidevault {
  color-scheme: light;
  --sv-brand: #ff3f0a; --sv-brand-strong: #d93407; --sv-brand-tint: #ffe6dc;
  --sv-bg: #ffffff; --sv-surface: #ffffff; --sv-surface-sunken: #eceef1; --sv-surface-muted: #e4e7eb;
  --sv-text: #1a1a1a; --sv-text-secondary: #6b6b6b;
  --sv-border: rgba(20,20,20,0.12); --sv-border-strong: rgba(20,20,20,0.20);
  --sv-action-bg: #1a1a1a; --sv-action-fg: #ffffff;
  --sv-success: #1f9d63; --sv-warning: #c9930c; --sv-danger: #d14b3c;
  --sv-frame: #eceef1; --sv-placeholder: #6b6b6b; --sv-link: #b92d09; --sv-focus: #d93407; --sv-control-border: #777777;
  --sv-font-sans: "Helvetica Neue", "Helvetica", "Arimo", Arial, system-ui, -apple-system, sans-serif;
  --sv-text-body: 14.5px; --sv-text-small: 13px; --sv-text-meta: 12.5px;
  --sv-text-heading: 32px; --sv-text-section: 23px; --sv-text-subheading: 18px;
  --sv-leading-body: 1.55; --sv-leading-heading: 1.3;
  --sv-radius-control: 11px; --sv-radius-card: 16px; --sv-radius-composer: 18px; --sv-radius-panel: 24px; --sv-radius-pill: 999px;
  --sv-shadow-card: 0 1px 2px rgba(20,20,28,0.06), 0 10px 28px -22px rgba(20,20,28,0.30);
  --sv-shadow-panel: 0 30px 70px -30px rgba(20,20,28,0.26), 0 6px 18px -12px rgba(20,20,28,0.08);
  --sv-shadow-popover: 0 12px 30px -10px rgba(20,20,28,0.18);
  --sv-ease-out: cubic-bezier(0,0,0.2,1);
  --sv-duration-fast: 150ms; --sv-duration: 220ms; --sv-duration-slow: 320ms;
  /* Prototype extensions (not in the token file): readable status text. */
  --svp-danger-text: #b3261e; --svp-warning-tint: #fff4d6; --svp-danger-tint: #fde8e6; --svp-success-tint: #e3f5ec;
}
.slidevault[data-theme="dark"] {
  color-scheme: dark;
  --sv-brand: #ff5a2c; --sv-brand-strong: #ff7048; --sv-brand-tint: rgba(255,63,10,0.16);
  --sv-bg: #0b0c0f; --sv-surface: #191a1e; --sv-surface-sunken: rgba(255,255,255,0.08); --sv-surface-muted: rgba(255,255,255,0.12);
  --sv-text: #f4f4f4; --sv-text-secondary: #a9a9ac;
  --sv-border: rgba(255,255,255,0.14); --sv-border-strong: rgba(255,255,255,0.23);
  --sv-action-bg: #fafafa; --sv-action-fg: #0b0b0d;
  --sv-success: #34c77d; --sv-warning: #e0a33c; --sv-danger: #f0685a;
  --sv-frame: #26272c; --sv-placeholder: #a9a9ac; --sv-link: #ff8a67; --sv-focus: #ff7048; --sv-control-border: #83848a;
  --sv-shadow-card: 0 1px 0 rgba(255,255,255,0.04), 0 12px 30px -20px rgba(0,0,0,0.90);
  --sv-shadow-panel: 0 30px 70px -30px rgba(0,0,0,0.65), 0 6px 18px -12px rgba(0,0,0,0.40);
  --sv-shadow-popover: 0 12px 30px -10px rgba(0,0,0,0.60);
  --svp-danger-text: #ff9a8f; --svp-warning-tint: rgba(224,163,60,0.16); --svp-danger-tint: rgba(240,104,90,0.16); --svp-success-tint: rgba(52,199,125,0.14);
}
@media (prefers-reduced-motion: reduce) {
  .slidevault { --sv-duration-fast: 0ms; --sv-duration: 0ms; --sv-duration-slow: 0ms; }
}

/* ------------------------------------------------------------------
   Base (scoped to .slidevault)
------------------------------------------------------------------- */
.slidevault { font-family: var(--sv-font-sans); font-size: var(--sv-text-body); line-height: var(--sv-leading-body); color: var(--sv-text); }
.slidevault *, .slidevault *::before, .slidevault *::after { box-sizing: border-box; }
.slidevault :where(h1, h2, h3, p, dl, dd, figure) { margin: 0; }
.slidevault :where(h1, h2, h3) { line-height: var(--sv-leading-heading); font-weight: 600; }
.slidevault :where(button, input, select, textarea) { font: inherit; color: inherit; }
.slidevault :where(a) { color: var(--sv-link); }
.slidevault :focus-visible { outline: 2px solid var(--sv-focus); outline-offset: 2px; }
.slidevault [tabindex="-1"]:focus { outline: none; }
.slidevault .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.slidevault .ic { width: 18px; height: 18px; flex: none; }
.slidevault .ic-sm { width: 14px; height: 14px; }
.sv-app { background: var(--sv-bg); min-height: 100vh; display: flex; flex-direction: column; }
.sv-wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 40px; }
@media (max-width: 900px) { .sv-wrap { padding: 0 20px; } }
@media (max-width: 480px) { .sv-wrap { padding: 0 16px; } }
.sv-main { flex: 1; padding: 24px 0 120px; outline: none; }
.meta { font-size: var(--sv-text-meta); color: var(--sv-text-secondary); }
.muted { color: var(--sv-text-secondary); }
.stack > * + * { margin-top: 12px; }
.row-flex { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.h1 { font-size: 30px; }
.h2 { font-size: var(--sv-text-subheading); }
@media (max-width: 480px) { .h1 { font-size: 24px; } }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--sv-text-secondary); }

/* Skip link */
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--sv-action-bg); color: var(--sv-action-fg); border: 0; border-radius: var(--sv-radius-control); padding: 10px 14px; font-weight: 600; cursor: pointer; }
.skip:focus { top: 12px; }

/* ------------------------------------------------------------------
   Buttons, fields, chips
------------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--sv-radius-control); border: 1px solid var(--sv-control-border); background: var(--sv-surface); color: var(--sv-text); font-size: var(--sv-text-small); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color var(--sv-duration-fast) var(--sv-ease-out); }
.btn:hover { background: var(--sv-surface-sunken); }
.btn-primary { background: var(--sv-action-bg); color: var(--sv-action-fg); border-color: var(--sv-action-bg); }
.btn-primary:hover { background: var(--sv-action-bg); opacity: .86; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--sv-surface-sunken); }
.btn-danger { color: var(--svp-danger-text); border-color: var(--sv-danger); }
.btn-sm { min-height: 36px; padding: 0 12px; }
.btn-icon { width: 40px; padding: 0; }
.btn-icon.btn-sm { width: 36px; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"] { border-color: var(--sv-brand); box-shadow: inset 0 0 0 1px var(--sv-brand); }
.btn-link { background: none; border: 0; padding: 4px 2px; color: var(--sv-link); font-weight: 600; font-size: var(--sv-text-small); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label, .legend { font-size: var(--sv-text-small); font-weight: 600; }
.hint { font-size: var(--sv-text-meta); color: var(--sv-text-secondary); }
.err { font-size: var(--sv-text-meta); color: var(--svp-danger-text); font-weight: 600; display: flex; gap: 6px; align-items: center; }
.input, .select { min-height: 40px; border: 1px solid var(--sv-control-border); border-radius: var(--sv-radius-control); background: var(--sv-surface); padding: 0 12px; width: 100%; min-width: 0; }
.input::placeholder { color: var(--sv-placeholder); opacity: 1; }
.input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--sv-danger); box-shadow: inset 0 0 0 1px var(--sv-danger); }
.select-sm { min-height: 36px; font-size: var(--sv-text-small); width: auto; }
.badge { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 9px; border-radius: var(--sv-radius-pill); font-size: 12px; font-weight: 600; background: var(--sv-surface-sunken); color: var(--sv-text); border: 1px solid var(--sv-border); white-space: nowrap; line-height: 1.2; }
.badge .ic { width: 13px; height: 13px; }
.badge.cls-canonical { background: var(--sv-brand-tint); border-color: transparent; }
.badge.warn { background: var(--svp-warning-tint); border-color: transparent; }
.badge.danger { background: var(--svp-danger-tint); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot-approved { background: var(--sv-success); }
.dot-draft { background: var(--sv-warning); }
.dot-retired { background: transparent; border: 1.5px solid var(--sv-text-secondary); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--sv-radius-pill); border: 1px solid var(--sv-border-strong); background: var(--sv-surface); color: var(--sv-text); font-size: var(--sv-text-small); cursor: pointer; text-decoration: none; }
.chip-btn:hover { background: var(--sv-surface-sunken); }
.chip-btn[aria-pressed="true"], .chip-btn[aria-selected="true"] { background: var(--sv-action-bg); color: var(--sv-action-fg); border-color: var(--sv-action-bg); }

/* Tooltips for disabled controls */
.tipw { position: relative; display: inline-flex; }
.tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--sv-action-bg); color: var(--sv-action-fg); font-size: 12.5px; font-weight: 500; line-height: 1.4; padding: 6px 10px; border-radius: 8px; width: max-content; max-width: 240px; white-space: normal; z-index: 40; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity var(--sv-duration-fast); text-align: left; }
.tipw:hover .tip, .tipw:focus-within .tip { opacity: 1; visibility: visible; }
.tip.tip-end { left: auto; right: 0; transform: none; }
.tip.tip-start { left: 0; transform: none; }
.tip.tip-below { bottom: auto; top: calc(100% + 8px); }

/* Banners and states */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--sv-border); background: var(--sv-surface); font-size: var(--sv-text-small); }
.banner .ic { margin-top: 1px; }
.banner.sim { background: var(--svp-warning-tint); border-color: transparent; }
.banner.danger { background: var(--svp-danger-tint); border-color: transparent; }
.banner.ok { background: var(--svp-success-tint); border-color: transparent; }
.banner.info { background: var(--sv-surface-sunken); border-color: transparent; }
.sim-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 6px; background: var(--svp-warning-tint); color: var(--sv-text); white-space: nowrap; }
.state { text-align: center; padding: 48px 20px; border: 1px dashed var(--sv-border-strong); border-radius: var(--sv-radius-card); background: var(--sv-surface); }
.state .ic-big { width: 36px; height: 36px; color: var(--sv-text-secondary); }
.state h2 { font-size: 18px; margin: 10px 0 6px; }
.state p { color: var(--sv-text-secondary); max-width: 520px; margin: 0 auto 16px; }
.state.error { border-style: solid; border-color: var(--sv-danger); }
.skel { background: var(--sv-surface-sunken); border-radius: 8px; position: relative; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) {
  .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: sv-shimmer 1.1s var(--sv-ease-out) 3; }
  .spin { animation: sv-spin 1s linear infinite; }
}
@keyframes sv-shimmer { to { transform: translateX(100%); } }
@keyframes sv-spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------
   Top bar (application shell)
------------------------------------------------------------------- */
.sv-top { background: var(--sv-bg); }
.sv-brandrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-top: 28px; }
.brand { display: flex; align-items: center; gap: 20px; text-decoration: none; color: var(--sv-text); min-width: 0; }
.brand-mark { width: 66px; height: 66px; border-radius: 18px; background: var(--sv-surface-sunken); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 34px; height: 34px; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sv-text-secondary); line-height: 1.2; }
.brand-name { font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.brand-tag { color: var(--sv-text-secondary); font-size: 17px; margin-top: 8px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.role-sw { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border: 1px solid var(--sv-border-strong); border-radius: 14px; background: var(--sv-surface); box-shadow: var(--sv-shadow-card); }
.role-sw label { font-size: 12px; font-weight: 600; color: var(--sv-text-secondary); white-space: nowrap; }
.role-sw .note { font-size: 11px; color: var(--sv-text-secondary); line-height: 1.1; white-space: nowrap; }
.role-sw .stack-col { display: flex; flex-direction: column; gap: 2px; }
.sv-tabrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--sv-border); margin-top: 24px; }
.sv-nav ul { list-style: none; display: flex; gap: 0; margin: 0; padding: 0; flex-wrap: wrap; }
.sv-nav a { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 6px; margin-right: 28px; color: var(--sv-text-secondary); text-decoration: none; font-weight: 500; font-size: 18px; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.sv-nav a .ic { width: 22px; height: 22px; }
.sv-nav a:hover { color: var(--sv-text); }
.sv-nav a[aria-current="page"] { color: var(--sv-text); font-weight: 600; border-bottom-color: var(--sv-brand); }
.sv-nav a[aria-current="page"] .ic { color: var(--sv-brand); }
.top-search { position: relative; min-width: 0; width: 320px; max-width: 100%; margin-bottom: 8px; }
.top-search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--sv-text-secondary); pointer-events: none; }
.top-search input { padding-left: 38px; background: var(--sv-surface-sunken); border-color: var(--sv-border-strong); border-radius: 999px; }
.top-search input:focus { background: var(--sv-surface); }
.slidevault[data-route="home"] .top-search { display: none; }
@media (max-width: 900px) {
  .brand-name { font-size: 30px; }
  .brand-tag { font-size: 15px; }
  .sv-nav a { font-size: 16px; margin-right: 16px; }
  .top-search { width: 100%; order: 3; }
}
@media (max-width: 700px) {
  .sv-brandrow { padding-top: 16px; flex-wrap: wrap; }
  .brand { gap: 14px; }
  .brand-mark { width: 48px; height: 48px; border-radius: 14px; }
  .brand-mark svg { width: 26px; height: 26px; }
  .brand-name { font-size: 26px; }
  .brand-tag { display: none; }
  .sv-tabrow { margin-top: 14px; }
  .sv-nav ul { flex-wrap: nowrap; overflow-x: auto; }
  .sv-nav a { min-height: 46px; font-size: 15px; gap: 6px; margin-right: 12px; }
  .sv-nav a .ic { width: 18px; height: 18px; }
  .role-sw .note { display: none; }
}
@media (max-width: 480px) {
  .role-sw label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .role-sw { padding-left: 8px; }
}
@media (max-width: 400px) { .sv-nav .ic { display: none; } }

/* Home hero (matches v1: typed headline, pill search, Try chips) */
.hero { padding: 36px 0 4px; max-width: 1120px; }
.hero-h { font-size: clamp(30px, 5vw, 50px); font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 28px; min-height: 1.2em; }
.hero-h .typed { font-weight: 700; }
.hero-h .caret { display: inline-block; width: 3px; height: .95em; background: var(--sv-brand); margin-left: 3px; vertical-align: -.1em; }
@media (prefers-reduced-motion: no-preference) { .hero-h .caret { animation: sv-blink 1s steps(1) infinite; } }
@keyframes sv-blink { 50% { opacity: 0; } }
.hero .big-search { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 22px; background: var(--sv-surface); border: 1px solid var(--sv-border-strong); border-radius: 26px; box-shadow: var(--sv-shadow-panel); }
.hero .big-search:focus-within { outline: 2px solid var(--sv-focus); outline-offset: 2px; }
.hero .big-search .box { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; position: static; }
.hero .big-search .box .ic { position: static; transform: none; width: 22px; height: 22px; color: var(--sv-text-secondary); }
.hero .big-search input { border: 0; background: transparent; box-shadow: none; outline: none; min-height: 56px; padding: 0; font-size: 20px; border-radius: 0; }
.hero .big-search .hero-btn { min-height: 56px; padding: 0 28px; border-radius: 16px; font-size: 17px; }
.hero .suggest { margin-top: 18px; gap: 12px; }
.hero .suggest .meta { font-size: 16px; }
.hero .suggest .chip-btn { min-height: 40px; padding: 0 18px; font-size: 16px; background: var(--sv-surface-sunken); border-color: var(--sv-border); font-weight: 500; }
@media (max-width: 700px) {
  .hero { padding-top: 36px; }
  .hero .big-search { flex-wrap: wrap; padding: 8px 8px 8px 16px; }
  .hero .big-search input { font-size: 17px; }
  .hero .big-search .hero-btn { width: 100%; }
}

/* Adding-to bar */
.adding-sticky { position: sticky; top: 0; z-index: 20; }
@media (max-width: 700px) { .adding-sticky { position: static; } }
.adding-bar { background: var(--sv-surface); border-bottom: 1px solid var(--sv-border); }
.adding-bar .sv-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 8px; padding-bottom: 8px; font-size: var(--sv-text-small); }
.adding-bar .lbl { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.adding-bar .lbl .ic { color: var(--sv-brand); }
.adding-bar.fill { background: var(--sv-brand-tint); }
.adding-bar select { max-width: 260px; }

/* Breadcrumbs */
.crumbs { margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 0; padding: 0; font-size: var(--sv-text-small); min-width: 0; }
.crumbs li { display: inline-flex; align-items: center; gap: 2px; min-width: 0; }
.crumbs li + li::before { content: "›"; color: var(--sv-text-secondary); padding: 0 6px; }
.crumbs a { color: var(--sv-text); text-decoration: underline; text-decoration-color: var(--sv-border-strong); text-underline-offset: 3px; }
.crumbs a:hover { text-decoration-color: currentColor; }
.crumbs [aria-current] { font-weight: 600; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-link { font-size: var(--sv-text-small); }

/* ------------------------------------------------------------------
   Cards, thumbnails
------------------------------------------------------------------- */
.card { background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: var(--sv-radius-card); box-shadow: var(--sv-shadow-card); overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
.card.is-selected { border-color: var(--sv-brand); box-shadow: 0 0 0 1px var(--sv-brand), var(--sv-shadow-card); }
.thumb { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--sv-surface-sunken); border: 0; padding: 0; margin: 0; cursor: zoom-in; position: relative; overflow: hidden; }
.thumb svg { width: 100%; height: 100%; display: block; }
.thumb .zoom { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 8px; background: rgba(0,0,0,.6); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity var(--sv-duration-fast); }
.thumb:hover .zoom, .thumb:focus-visible .zoom { opacity: 1; }
.thumb:focus-visible { outline-offset: -3px; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.card-title { font-weight: 600; font-size: 14.5px; color: var(--sv-text); text-decoration: none; line-height: 1.35; overflow-wrap: anywhere; }
.slidevault a.card-title { color: var(--sv-text); }
.card-title:hover { text-decoration: underline; }
.matched { font-size: var(--sv-text-meta); color: var(--sv-text); background: var(--sv-surface-sunken); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; }
.matched b { font-weight: 600; }
.card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.cmp-check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--sv-text-small); font-weight: 600; cursor: pointer; min-height: 36px; padding: 0 10px 0 8px; border-radius: var(--sv-radius-control); border: 1px solid var(--sv-control-border); background: var(--sv-surface); }
.cmp-check input { width: 18px; height: 18px; accent-color: var(--sv-brand-strong); margin: 0; }

/* Home rows */

.suggest { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Library */
.lib-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--sv-control-border); border-radius: var(--sv-radius-control); overflow: hidden; }
.seg a, .seg button { min-height: 38px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--sv-text); background: var(--sv-surface); border: 0; font-weight: 600; font-size: var(--sv-text-small); cursor: pointer; }

}
.chips-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }

/* Detail screens */

.panel { background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: var(--sv-radius-card); padding: 20px; box-shadow: var(--sv-shadow-card); min-width: 0; }

/* Compare floating bar */
.cmp-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25; width: min(760px, calc(100vw - 24px)); background: var(--sv-surface); border: 1px solid var(--sv-border-strong); border-radius: var(--sv-radius-card); box-shadow: var(--sv-shadow-panel); padding: 10px 12px; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }

/* Dialogs */
dialog.sv-dialog { border: 1px solid var(--sv-border); padding: 0; border-radius: var(--sv-radius-panel); background: var(--sv-surface); color: var(--sv-text); box-shadow: var(--sv-shadow-panel); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }

.dlg-head { padding: 18px 20px 10px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; border-radius: 50%; width: 44px; height: 44px; padding: 0; background: var(--sv-surface); box-shadow: var(--sv-shadow-popover); }
.lb-prev { left: 10px; } .lb-next { right: 10px; }
.lb-caption { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 12px; }
.counter { font-variant-numeric: tabular-nums; font-size: var(--sv-text-small); font-weight: 600; }

/* My decks and draft deck */
.decklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.deckrow { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px; }

.draft-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.edit-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }

.edit-wrap:hover .pencil, .edit-wrap:focus-within .pencil { opacity: 1; color: var(--sv-text); }
.inline-edit { border: 0; border-bottom: 2px dashed var(--sv-control-border); background: transparent; padding: 2px 2px; border-radius: 4px 4px 0 0; min-width: 0; width: 100%; color: var(--sv-text); }
.inline-edit:hover { border-bottom-style: solid; background: var(--sv-surface-sunken); }
.inline-edit:focus { border-bottom: 2px solid var(--sv-focus); background: var(--sv-surface); outline: none; box-shadow: 0 0 0 2px var(--sv-focus); }

@supports (field-sizing: content) { .inline-edit { field-sizing: content; width: auto; min-width: 6ch; max-width: 100%; } }
@media (max-width: 480px) { .inline-edit.h1e { font-size: 21px; } }

.save-ind { display: inline-flex; align-items: center; gap: 6px; font-size: var(--sv-text-small); font-weight: 600; }

.meter { display: inline-flex; align-items: center; gap: 8px; font-size: var(--sv-text-small); font-weight: 600; }
.meter .bar { width: 120px; height: 8px; border-radius: 99px; background: var(--sv-surface-muted); overflow: hidden; border: 1px solid var(--sv-border-strong); }
.meter .bar i { display: block; height: 100%; background: var(--sv-text); border-radius: 99px; }
.meter.over .bar i { background: var(--sv-danger); }
.draft-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 1023px) { .draft-layout { grid-template-columns: minmax(0, 1fr); } }
.sections { display: flex; flex-direction: column; gap: 16px; }
.section-card { background: var(--sv-surface); border: 1px solid var(--sv-border); border-radius: var(--sv-radius-card); padding: 14px 16px 16px; box-shadow: var(--sv-shadow-card); }
.section-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.section-head .edit-wrap { flex: 1 1 220px; }
.items { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.items.drop-into { outline: 2px dashed var(--sv-brand); outline-offset: 4px; border-radius: 10px; }
.item { display: grid; grid-template-columns: auto 132px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--sv-border); border-radius: 12px; background: var(--sv-surface); position: relative; }
.item .thumb { border-radius: 6px; border: 1px solid var(--sv-border); }
.item.placeholder { border: 1.5px dashed var(--sv-control-border); background: var(--sv-surface-sunken); }

.item.flash { box-shadow: 0 0 0 3px var(--sv-brand); }

.item.drop-before::before, .item.drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 3px; border-radius: 3px; background: var(--sv-brand); }
.item.drop-before::before { top: -6px; } .item.drop-after::after { bottom: -6px; }
.ph-box { aspect-ratio: 16/9; border-radius: 6px; border: 1.5px dashed var(--sv-control-border); display: grid; place-items: center; color: var(--sv-text-secondary); background: var(--sv-surface); }
.item-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

}

}
.section-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.members li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--sv-border); }
.members { list-style: none; margin: 0; padding: 0; }

.role-defs dt { font-weight: 700; font-size: var(--sv-text-small); margin-top: 8px; }
.role-defs dd { font-size: var(--sv-text-meta); color: var(--sv-text-secondary); }

/* New deck form */
.form-card { max-width: 760px; }
.sec-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--sv-border); border-radius: 12px; overflow: hidden; }
.sec-list li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--sv-border); flex-wrap: wrap; }

.sec-list input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--sv-brand-strong); }

/* Export */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

.prov th { font-size: 12px; color: var(--sv-text-secondary); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; font-size: var(--sv-text-small); }

/* Upload */
.upload-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .upload-grid { grid-template-columns: minmax(0, 1fr); } }
.dropzone { border: 2px dashed var(--sv-control-border); border-radius: var(--sv-radius-card); padding: 28px 20px; text-align: center; background: var(--sv-surface); }

@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.form-grid .full { grid-column: 1 / -1; }
.radio-row { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* Footer */
.sv-foot { border-top: 1px solid var(--sv-border); background: var(--sv-surface); padding: 16px 0 20px; font-size: var(--sv-text-small); }
.sv-foot .sv-wrap { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-start; justify-content: space-between; }

.proto-controls .pc { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-top: 8px; }

/* ------------------------------------------------------------------
   Round 2: layout with Current deck panel, tooltips, navigation bar,
   numbered step strip
------------------------------------------------------------------- */
.sv-layout { display: flex; align-items: flex-start; flex: 1; min-width: 0; }
.sv-layout > .sv-main { flex: 1; min-width: 0; }
.tray-wrap { display: contents; }
.btn-xs { min-height: 28px; min-width: 28px; padding: 0 6px; border-radius: 8px; }
.slidevault[data-role="viewer"] [data-editor-only] { display: none; }

/* Tooltips (hover and keyboard focus) */
.slidevault [data-tip] { position: relative; }
.slidevault [data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--sv-action-bg); color: var(--sv-action-fg); font-size: 12.5px; font-weight: 500; line-height: 1.4; padding: 6px 10px; border-radius: 8px; width: max-content; max-width: 240px; white-space: normal; text-align: left; z-index: 70; pointer-events: none; display: none; }
.slidevault [data-tip]:hover::after, .slidevault [data-tip]:focus-visible::after, .slidevault .tipbox:focus-within::after { display: block; }
.slidevault [data-tip-pos~="end"]::after { left: auto; right: 0; transform: none; }
.slidevault [data-tip-pos~="start"]::after { left: 0; transform: none; }
.slidevault [data-tip-pos~="up"]::after { top: auto; bottom: calc(100% + 8px); }
.slidevault [data-tip-pos~="left"]::after { top: 50%; left: auto; right: calc(100% + 8px); transform: translateY(-50%); }

  pool.forEach(function (it) {
    if (!passFilters(it, st.F, f.key)) return;
    if (tokens.length && !matchItem(itemFields(it, st.view), tokens)) return;
    var v = it[f.key]; if (v == null) return;
    c[String(v)] = (c[String(v)] || 0) + 1;
  });
  return c;
}
function filterReason(st) {

  return parts.join('; ');
}

<script>
(function () {
